name: Publish website

on:
  push:
    branches:
      - main
      - acedp7-lettera-mesiversario
    paths:
      - .github/workflows/pages.yml
      - index.html
      - styles.css
      - app.js
      - assets/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          include-hidden-files: false
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
